name: Build ZeroClaw HA Add-on

on:
  push:
    paths:
      - "zeroclaw-hassio/**"
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/scopeone01/zeroclaw-hassio

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout hassio repo
        uses: actions/checkout@v4

      - name: Checkout ZeroClaw source
        uses: actions/checkout@v4
        with:
          repository: openagen/zeroclaw
          path: zeroclaw-source

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: zeroclaw-hassio/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}-amd64:latest,${{ env.IMAGE_NAME }}-amd64:0.1.0
          build-args: |
            ZEROCLAW_SOURCE=zeroclaw-source
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push aarch64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: zeroclaw-hassio/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}-aarch64:latest,${{ env.IMAGE_NAME }}-aarch64:0.1.0
          build-args: |
            ZEROCLAW_SOURCE=zeroclaw-source
          cache-from: type=gha
          cache-to: type=gha,mode=max
