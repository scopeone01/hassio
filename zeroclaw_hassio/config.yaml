---
# ZeroClaw Home Assistant Add-on Configuration
# See: https://developers.home-assistant.io/docs/add-ons/configuration

name: "ZeroClaw AI Agent"
description: "Autonomous AI agent for Home Assistant — control your smart home with natural language. Supports all major LLM providers."
version: "0.1.0"
slug: zeroclaw
url: "https://github.com/zeroclaw-labs/zeroclaw"
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 3000
ingress_entry: /ha/ui
panel_icon: "mdi:robot"
panel_title: "ZeroClaw"
startup: application
boot: auto

# Resource limits
resources_limits:
  cpus: "2.0"
  memory: "2048M"

ports:
  3000/tcp: null  # Ingress-only, no external port needed

# Persistent data
map:
  - config:rw
  - share:rw
  - ssl:ro

# Environment passed to the container
environment:
  ZEROCLAW_ALLOW_PUBLIC_BIND: "true"

# Configuration schema — rendered as the settings UI in HA
options:
  provider: "ollama"
  model: ""
  api_key: ""
  api_url: "http://homeassistant:11434"
  temperature: 0.7
  system_prompt: "You are a helpful smart home AI assistant running inside Home Assistant. Use ha_* tools to control devices and answer questions about the home."
  allowed_domains:
    - light
    - switch
    - climate
    - cover
    - media_player
    - fan
    - scene
    - script
    - automation
    - input_boolean
    - input_number
    - input_select
  event_listener: true
  event_filter:
    - state_changed
  mqtt_enabled: false
  mqtt_broker: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  log_level: "info"

schema:
  provider: "str"
  model: "str?"
  api_key: "password?"
  api_url: "url?"
  temperature: "float(0.0,2.0)"
  system_prompt: "str?"
  allowed_domains:
    - "str"
  event_listener: "bool"
  event_filter:
    - "str"
  mqtt_enabled: "bool"
  mqtt_broker: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  log_level: "list(trace|debug|info|warn|error)"
